[workspace]
resolver = "2"
members = [
    "crates/types",
    "crates/crypto",
    "crates/state",
    "crates/storage",
    "crates/execution",
    "crates/mempool",
    "crates/consensus",
    "crates/network",
    "crates/rpc",
    "crates/node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
