[package]
name = "storage"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Native RocksDB. Off by default so environments without librocksdb still build.
# Enable with `--features rocksdb`.
rocksdb = ["dep:rocksdb"]

[dependencies]
types = { path = "../types" }
thiserror.workspace = true
rocksdb = { version = "0.22", optional = true }

[dev-dependencies]
crypto = { path = "../crypto" }
execution = { path = "../execution" }
mempool = { path = "../mempool" }
hex.workspace = true
